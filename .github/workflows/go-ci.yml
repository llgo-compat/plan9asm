          - 110
          - 111
          - 112
          - 113
          - 114
          - 115
          - 116
          - 117
          - 118
          - 119
          - 120
          - 121
          - 122
          - 123
          - 124
          - 125
          - 126
          - 127

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          # Discovery reports and the audited assembly ledger pin this exact
          # compiler/assembler version; do not silently advance to 1.27.2.
          go-version: '1.27.1'
          cache: true

      - name: Translate and compile discovered assembly
        # Leave a separate budget for the latest atomic partial checkpoint.
        timeout-minutes: 330
        env:
          # Reuse only compiled Go objects from this task's restored cache.
          # Source/tool observations and LLVM objects are still checked afresh.
          PLAN9ASM_DISCOVERY_BUILD_CACHE: ${{ runner.temp }}/go-build-cache
          PLAN9ASM_DISCOVERY_EVENTS: '1'
          # Retained exact versions can outlive their public origin and the
          # first proxy's cache. Verify against the signed database directly;
          # some module proxies return 404 for checksum tiles they advertise.
          GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct
          GOSUMDB: ${{ github.repository_owner == 'xgo-dev' && 'sum.golang.google.cn' || 'sum.golang.org https://sum.golang.org' }}
        run: scripts/check-discovered-library-corpus.sh "${{ matrix.shard }}" 128

      - name: Upload shard report
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v6
        with:
          name: discovered-corpus-shard-${{ matrix.shard }}
          path: _out/discovered-library-corpus/shard-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Upload shard phase journal
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v6
        with:
          name: discovered-corpus-events-${{ matrix.shard }}
          path: _out/discovered-library-corpus/shard-${{ matrix.shard }}.events.jsonl
          if-no-files-found: error

  discovered_library_corpus_verify:
    name: discovered-corpus aggregate verification
    needs: [discovered_library_priority, discovered_library_corpus]
    if: ${{ !cancelled() }}
    # The readers do not translate candidates here, but their Go binaries
    # link plan9asm's LLVM library and still require the exact LLVM 22 setup.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install LLVM 22
        timeout-minutes: 14
        run: bash scripts/install-ci-llvm22-ubuntu.sh

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version: '1.27.1'
          cache: true

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: discovered-corpus-shard-*
          path: _out/discovered-library-corpus
          merge-multiple: true

      - name: Verify complete coverage and report progress
        if: ${{ !cancelled() }}
        run: scripts/verify-discovered-library-corpus.sh --progress

      - name: Upload discovery progress
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: discovery-progress
          path: |
            _out/discovered-library-corpus/scan-status.json
            _out/discovered-library-corpus/assembly-progress.json
          if-no-files-found: error
